; Settings of the System ReShock VR mod. The VR options page changes most of them.
; Lines that start with ; are comments. A value outside its range is moved to the nearest limit.

[general]
; Your height in centimetres. The VR body and the camera are scaled to it. 165 to 185.
player_height = 176
; Automatically decreases movement speed and reduces bullet spread when you physically
; aim down the sights. 1 is on, 0 is off.
auto_ads = 1
; Title menu and pause menus: how far, in degrees, your head may turn left or right before
; the view recenters. Not on the VR options page. 5 to 90.
menu_recenter_angle = 25
; Title menu and pause menus: how long, in seconds, your head must stay turned past
; menu_recenter_angle before the view recenters. Not on the VR options page. 0 to 10.
menu_recenter_delay = 2.5
; Title menu and pause menus: how long, in seconds, the recenter takes. 0 recenters at once.
; Not on the VR options page. 0 to 5.
menu_recenter_duration = 0.1

[movement]
; How fast the view turns with the right thumbstick. 1 is the slowest, 10 the fastest.
vr_look_sensitivity = 5

[cyberspace]
; Pitches the view up and down in steps with the right thumbstick instead of smoothly.
; 1 is on, 0 is off.
pitch_snap_turn = 1
; How far the right thumbstick must be pushed up or down before the view pitches. 0 to 1.
pitch_deadzone = 0.75
; How long one pitch snap takes, in seconds. 0 snaps at once. 0 to 1.
pitch_snap_duration = 0.7
; Size of the crosshair that follows the right controller, in percent of its normal size.
; 50 to 150.
crosshair_scale = 100