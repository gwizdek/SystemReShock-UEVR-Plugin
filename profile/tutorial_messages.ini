; Tutorial popup texts, one line per row of the game's table DT_Tutorials.
; Written by scripts\export-tutorial-texts.py from the game's asset; the texts are the game's own.
; Edit the text after '=' to change what a popup shows. Keep the row name as it is.
; {Real_Interact} and the like are button placeholders; documentation\tutorial-popups.md
; explains them.

[tutorials]
DoorInteract = Press {Real_Interact} to open the door.
Inventory = Press {Real_ToggleMFD} to open your Neural Interface, where you can manage your inventory and access important information.
InventoryAdvanced = In the Neural Interface, you can use, sort, and drop items, enable and disable Hardware you have installed, and access data you collect in the environment. Press {Real_ToggleMFD} to close the Interface.
PickupMedipatch = Press {Real_Interact} to pick up Medipatch Healing Agent.
ExamineMediPatch = Press {Real_PrimaryAttack} to use the Medipatch which will restore a small amount of health over time.
LockedDoor = This door is locked. Find the Standard Access Card.
ButtonInteract = Press {Real_Interact} to push the button.
OpenBriefcase = Press {Real_Interact} to open the Briefcase.
SurgeryMachine = Press {Real_Interact} to restore your health to maximum by using the Surgery Machine.
Attack = Press {Real_PrimaryAttack} to attack the Serv-Bot.
PickupBerserk = The Berserk Patch will temporarily increase your physical damage. May cause side-effects.
DestroyCamera = Attack the security camera to destroy it.
PickupStaminup = The Staminup Stimulant will temporarily negate exhaustion from all physical activity. May cause side-effects.
DataSticks = Data Sticks contain information that the Multimedia Data Reader can decrypt and display.
ExamineOtherPatch = You can cycle through the items in your Hotbar with {Locked_ZoomAxis,Gamepad_Real_HotbarCyclePrevious:Gamepad_Real_HotbarCycleNext,JCMS_Real_HotbarCyclePrevious:JCMS_Real_HotbarCycleNext}. You can also customize the contents of the Hotbar from the Neural Interface.
AudioLogs = Audio Logs contain important information about the environment. The Multimedia Data Reader is required to listen to them.
Keypad = Press {Real_Interact} to use the Keypad. The required code should be nearby.
CircuitPuzzle = Junction Boxes direct power to machinery. Press {Real_Interact} to open the Junction Box, direct power, and fix the Service Lift.
WiringPuzzleTutorial = Junction Boxes direct power to machinery. Balance the power level between the two points to enable the Force Bridge.
CyberspaceTerminals = You can gain higher access and open locked areas by jacking in to Cyberspace at these Terminals.
OpenCrate = Press {Real_Interact} to search the crate for supplies. Items can be moved to and from crates.
PowerStation = Press {Real_Interact} to replenish your energy from the Power Station.
PowerStationRecharging = Once used, a Power Station needs to recharge before it can be used again.
AmmoDepot = Ammo-Depot vending machines offer a selection of ammunition for Tri-Credits.
SalvageStation = Recycler units can be used to convert junk items into Tri-Credits.
ModStation = Mod-Kit Stations provide weapon upgrades for Tri-Credits.
TransdermalDispenser = Transdermal Dispensers offer a selection of dermal patches for Tri-Credits.
CargoLift = Store items in the Cargo Lift to free up space in your inventory. It is available on most floors on the station.
GarbageChute = If an item falls into the hull of Citadel Station, it's advisable to check the Garbage Chute.
DamageComputerNode = Destroy the Computer Nodes to reduce the security on this level.
RespawnChamber = If you have cancelled the Cyborg Conversion procedure, your body will be reassembled in this Restoration Bay if you die.
LearnToCrouch = Press {Real_Crouch} to crouch and enter crawlspaces
OutOfAmmo = Out of ammo. Press {Real_Reload,Gamepad_Real_Interact,JCMS_Real_Reload} to reload. Press {Real_ModeNext} to switch ammo types.
LowOnEnergy = Energy depleted. Use a Battery or Power Station to recharge your energy.
EquipSparqBeam = The Sparqbeam is an energy weapon, and requires energy to use. Press {Real_ModeNext} to change the firing power of the gun.
EquipMagPulse = Press {Real_ModeNext} to pump a second round into the chamber. Effective against robots.
EquipProxiMine = Press {Real_PrimaryAttack} to throw a Proximity Mine. It will attach to any surface and detonate when it detects movement.
EquipMinipistol = Press {Real_PrimaryAttack} to fire. Press {Real_Reload,Gamepad_Real_Interact,JCMS_Real_Reload} to reload.
EquipMagnum = High-powered pistol.
EquipShotgun = High damage at close range. Press {Real_ModeNext} to change ammo types.
EquipSkorpion = Automatic fire. Press {Real_ModeNext} to change ammo types.
EquipGrenadeLauncher = Grenades explode on contact. Press {Real_ModeNext} to change grenade types.
EquipAssaultRifle = Three-round burst. Press {Real_ModeNext} to change ammo types.
EquipIonRifle = Hold down {Real_PrimaryAttack} to charge, fires on release. Press {Real_ModeNext} to change the power setting.
EquipLaserRapier = Press {Real_PrimaryAttack} to attack. Hold down {Real_PrimaryAttack} and release for a stronger attack. Requires energy.
EquipRailgun = Heavy assault weapon. After firing, press {Real_ModeNext} to speed up charging time.
EquipPlasmaRifle = Experimental energy rifle. Press {Real_ModeNext} to load a plasma core.
EquipPipe = Press {Real_PrimaryAttack} to attack. Hold down {Real_PrimaryAttack} and release for a stronger attack.
PickupPipe = Press {Real_Interact} to pick up the Lead Pipe
ModkitMagnum = Press {Real_ModeNext} to toggle laser sight that increases damage when held on target. The laser requires a small amount of energy.
InspectDataReader = The Multimedia Data Reader allows the user to receive Emails, listen to Audio Logs, and decrypt Data Sticks.
InspectSysAnalyzer = The Systems Analyzer allows the user to monitor the status of Citadel Station's systems.
PickupNavUnit = Press {Real_Interact} to install Navigation and Mapping Unit V1
InspectNavUnit = The Navigation and Mapping Unit V1 tracks and stores terrain details on the map.
InspectNavUnitV2 = This advanced NavUnit V2 displays environmental hazards on the map.
PickupBioscan = Press {Real_Interact} to install Biological Systems Monitor V1
InspectBioscan = The Biological Systems Monitor V1 displays the user's health status.
InspectBioscanV2 = This advanced Bio-Scan V2 displays precise information about stimulants including the remaining dose in the user's system.
InspectVisionUnit = The Head-Mounted Vision Unit V1 uses a headlamp to improve visiblity in dark areas for a small amount of energy.
InspectVisionUnitV2 = This upgraded VisionUnit V2 uses infrared sensors to enhance viewing in dark areas for a small amount of energy.
InspectModKit = Modkits are single-use items used to upgrade specific weapons. All mods are permanent.
InspectTargetID = The Target Identifier V1 displays the vitals of any targeted enemy. Press {Real_AcquireTarget} to target an enemy under the reticle.
InspectTargetIDV2 = This upgraded Target ID V2 displays a target's current objective. Holding {Real_AcquireTarget} will scramble their priority computer but uses energy.
InspectTargetIDV3 = This advanced Target ID V3 displays a more detailed vital readout, identifies enemy weak points, and lowers the time to scramble priority systems.
InspectTurboBoots = The Turbo Motion Boots V1 provide a speed boost while holding {Real_Sprint} at the expense of energy.
InspectTurboBootsV2 = These upgraded Turbo Boots V2 provide a jump-assist while holding {Real_Jump} at the expense of energy.
InspectTurboBootsV3 = These advanced Turbo Boots V3 increase the vertical thrust of the jump-system.
InspectEnergyShield = The Energy/Projectile Shield V1 absorbs a minor amount of damage from projectiles and energy beams at the expense of energy.
InspectEnergyShieldV2 = This upgraded Energy Shield V2 absorbs an increased amount of damage for proportionally more energy.
InspectEnergyShieldV3 = This advanced Energy Shield V3 absorbs the maximum amount of damage for proportionally more energy.
InspectEnviroPack = The Environmental Protection Pack V1 protects the user from biological contamination at the expense of energy.
InspectEnviroPackV2 = This advanced Enviro Pack V2 protects the user from radiation in addition to biological contamination at the expense of energy.
InspectSensaround = The Sensaround Radar Unit V1 utilizes a radar system to scan around the user to locate useful items at the expense of a small amount of energy.
InspectSensaroundV2 = This upgraded Sensaround V2 detects enemies located nearby the user for a small amount of energy.
InspectSensaroundV3 = This advanced Sensaround V3 can penetrate through walls and reveal hidden passageways for a small amount of energy.
InspectInventoryExpander = The Micro Pocket Dimension provides additional inventory space.
