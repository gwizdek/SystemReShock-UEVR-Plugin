; Tutorial popup texts, one line per row of the game's table DT_Tutorials.
; First written by scripts\export-tutorial-texts.py from the game's asset, then rewritten for
; the VR controls and gestures of the mod (see README.md, Gestures and Controls).
; Edit the text after '=' to change what a popup shows. Keep the row name as it is.
; {Real_Interact} and the like are button placeholders; documentation\tutorial-popups.md
; explains them. A game action such as {Real_Interact} shows whatever key the player bound to
; it. The buttons the plugin reads itself have fixed placeholders that the plugin registers
; (SystemShockVR\vr_input_actions.cpp):
;   {VR_LeftGrip}  {VR_RightGrip}  {VR_RightThumb} (item selector)  {VR_RightTrigger} (laser pointer)
; The game's own actions on the VR buttons: A {Real_Jump}, B {Real_Interact}, X {Real_Crouch},
; Y {Real_ModeNext}, Right Trigger {Real_PrimaryAttack}, Left Trigger {Real_Aim},
; Left Thumb {Real_Sprint}, Right Thumb {Real_AcquireTarget}.
; Hand poses have no placeholder yet and are written in words.
; [popup] sizes the popup on the HUD in screen units: the text box (the game's is 500 x 75; the
; frame around it follows) and the font size (the game's is 20). duration is how many seconds a
; timed popup stays (the game's is 5); popups of tutorial areas stay until you leave the area.
; Leave the section out or set a value to 0 to keep the game's value.
; A line break inside a text is written as the two characters \n.

[popup]
width = 800
height = 200
font_size = 25
duration = 10

[tutorials]
DoorInteract = Physically touch the button with your finger to open the door.\nor\nIf your right hand is empty, turn on the Laser Pointer with {VR_RightTrigger}, point it at the button and press {Real_Interact}.
Inventory = Place your right hand over your inner left wrist and press {VR_RightGrip} to open or close your Neural Interface.\nor\nLong-press the left menu button (hamburger). This binding works only with some headsets and configurations.
InventoryAdvanced = In the Neural Interface, point the laser at an item and press {VR_RightTrigger} to select it or {VR_RightGrip} to open its menu. You can use, sort, and drop items, enable and disable installed Hardware, and read collected data. Press {Real_Crouch} to close the Interface.
PickupMedipatch = Grab the Medipatch with {VR_LeftGrip} and release it over your shoulder.\nor\nPoint your left or right hand at it (this highlights the item) and press the grip button to grab it from a distance.\nor\nPoint at it with the Laser Pointer ({VR_RightTrigger} to activate) and press {Real_Interact}.
ExamineMediPatch = Hold {VR_LeftGrip} and tap the Medipatch with your finger to use it. It restores a small amount of health over time.
LockedDoor = This door is locked. Find the Standard Access Card in the room behind you, then grab it from your waist with {VR_LeftGrip} and hold it near the yellow door scanner.\nUse your Access Card on yellow door scanners to unlock doors, provided the right permissions have been loaded onto it!
ButtonInteract = Physically press the button with your finger or point at it with the Laser Pointer and press {Real_Interact}.
OpenBriefcase = Physically touch the briefcase with your finger to open it.\nor\nUse the Laser Pointer and press {Real_Interact} to open it.\nThe Laser Pointer on your right hand or on a ranged weapon can interact with items, switches, levers and more using {Real_Interact}. It is a backup method.
SurgeryMachine = Physically touch the green button to restore your health to maximum.
Attack = Swing your weapon at the Serv-Bot to attack.\n\nOnly real swings register a hit!
PickupBerserk = The Berserk Patch will temporarily increase your physical damage. May cause side-effects.
DestroyCamera = Attack the security camera to destroy it.
PickupStaminup = The Staminup Stimulant will temporarily negate exhaustion from all physical activity. May cause side-effects.
DataSticks = Data Sticks contain information that the Multimedia Data Reader can decrypt and display.
ExamineOtherPatch = Hold {VR_RightThumb} to open the item selector, move your hand to an item in your Hotbar and release the button to take it. You can also customize the contents of the Hotbar from the Neural Interface.
AudioLogs = Audio Logs contain important information about the environment. The Multimedia Data Reader is required to listen to them.
Keypad = Physically touch the keypad buttons to press them. The required code should be nearby.
CircuitPuzzle = Junction Boxes direct power to machinery. Touch the center of the box with your finger to open it. Touch active puzzle elements to rotate them.\n\nDirect power and fix the Service Lift.
WiringPuzzleTutorial = Junction Boxes direct power to machinery. Gently touch the wire connectors, switches and rotators with your hand.\n\nBalance the power level between the two points to enable the Force Bridge.
CyberspaceTerminals = You can gain higher access and open locked areas by jacking in to Cyberspace at these Terminals. Touch the V-shaped port slightly to the left or right of the center.
OpenCrate = Highlight the crate with your left hand and press {VR_LeftGrip} to search it for supplies.\nItems can be moved to and from crates.\nPress {VR_LeftGrip} again to take all items and close the crate, or just close it with {Real_Crouch} or the MFD open/close gesture.
PowerStation = Hold your left hand close to the Power Station to replenish your energy.\nPower Stations are often hidden behind secret doors. There are plenty of secret doors on the Medical level. Search with the Laser Pointer and the {Real_Interact} button to find and open them.
PowerStationRecharging = Once used, a Power Station needs to recharge before it can be used again.
AmmoDepot = Ammo-Depot vending machines offer a selection of ammunition for Tri-Credits.\nTouch the coin slot to put coins in (if you have enough of them), then touch the green button on the depot's door to open it.
SalvageStation = Recycler units can be used to convert junk items into Tri-Credits.\nUse the {Real_Crouch} button or the MFD open/close gesture to close it after you put in junk items or vaporized junk.
ModStation = Mod-Kit Stations provide weapon upgrades for Tri-Credits.\nTouch the coin slot to put coins in (if you have enough of them), then touch the green button to release the mod.\nPut it into your inventory and use it from there.
TransdermalDispenser = Transdermal Dispensers offer a selection of dermal patches for Tri-Credits.
CargoLift = Store items in the Cargo Lift to free up space in your inventory. It is available on most floors on the station.
GarbageChute = If an item falls into the hull of Citadel Station, it's advisable to check the Garbage Chute.
DamageComputerNode = Destroy the Computer Nodes to reduce the security on this level.
RespawnChamber = If you have cancelled the Cyborg Conversion procedure, your body will be reassembled in this Restoration Bay if you die.
LearnToCrouch = Crouch physically or press {Real_Crouch} to enter crawlspaces.
OutOfAmmo = Out of ammo. Press {Real_Reload,Gamepad_Real_Interact,JCMS_Real_Reload} to reload. Press {Real_ModeNext} to switch ammo types.
LowOnEnergy = Energy depleted. If you have a Battery, equip it and then touch the blue icon on the front with your finger.\nPower Stations recharge all of your energy.
EquipSparqBeam = The Sparqbeam is an energy weapon, and requires energy to use. Press {Real_ModeNext} to change the firing power of the gun, shown by the colored lights on its side.
EquipMagPulse = Press {Real_ModeNext} to pump a second round into the chamber. Effective against robots.
EquipProxiMine = Point the hand holding the grenade in the direction you want, then press {Real_PrimaryAttack} to throw a Proximity Mine. It will attach to any surface and detonate when it detects movement.
EquipMinipistol = Press {Real_PrimaryAttack} to fire. Press {Real_Reload,Gamepad_Real_Interact,JCMS_Real_Reload} to reload.
EquipMagnum = High-powered pistol.
EquipShotgun = High damage at close range. Press {Real_ModeNext} to change ammo types.
EquipSkorpion = Automatic fire. Aim Down Sights to steady your aim. Press {Real_ModeNext} to change ammo types.
EquipGrenadeLauncher = Grenades explode on contact. Press {Real_ModeNext} to change grenade types.
EquipAssaultRifle = Three-round burst. Aim Down Sights to steady your aim. Press {Real_ModeNext} to change ammo types.
EquipIonRifle = Hold down {Real_PrimaryAttack} to charge, fires on release. Press {Real_ModeNext} to change the power setting.
EquipLaserRapier = Swing the Laser Rapier or press {Real_PrimaryAttack} to attack. Requires energy.
EquipRailgun = Heavy assault weapon. After firing, press {Real_ModeNext} to speed up charging time.
EquipPlasmaRifle = Experimental energy rifle. Press {Real_ModeNext} to load a plasma core.
EquipPipe = Swing the Lead Pipe to attack. Press {VR_RightGrip} over your shoulder to holster weapons. Press {VR_RightGrip} there again and move your hand forward to take the holstered weapon out.
PickupPipe = Grab the Lead Pipe with {VR_RightGrip}, or point the Laser Pointer at it and press {Real_Interact}.
ModkitMagnum = Press {Real_ModeNext} to toggle laser sight that increases damage when held on target. The laser requires a small amount of energy.
InspectDataReader = The Multimedia Data Reader allows the user to receive Emails, listen to Audio Logs, and decrypt Data Sticks.
InspectSysAnalyzer = The Systems Analyzer allows the user to monitor the status of Citadel Station's systems.
PickupNavUnit = Grab the Navigation and Mapping Unit V1 with {VR_RightGrip} and release it over your shoulder to install it, or point the Laser Pointer at it and press {Real_Interact}.
InspectNavUnit = The Navigation and Mapping Unit V1 tracks and stores terrain details on the map.
InspectNavUnitV2 = This advanced NavUnit V2 displays environmental hazards on the map.
PickupBioscan = Grab the Biological Systems Monitor V1 with {VR_RightGrip} and release it over your shoulder to install it, or point the Laser Pointer at it and press {Real_Interact}.\nTurn the bio reading on or off in the MFD.
InspectBioscan = The Biological Systems Monitor V1 displays the user's health status.
InspectBioscanV2 = This advanced Bio-Scan V2 displays precise information about stimulants including the remaining dose in the user's system.
InspectVisionUnit = The Head-Mounted Vision Unit V1 uses a headlamp to improve visibility in dark areas for a small amount of energy.\nPress {VR_LeftGrip} while holding your left hand close to your left ear to toggle it.
InspectVisionUnitV2 = This upgraded VisionUnit V2 uses infrared sensors to enhance viewing in dark areas for a small amount of energy.
InspectModKit = Modkits are single-use items used to upgrade specific weapons. All mods are permanent.
InspectTargetID = The Target Identifier V1 displays the vitals of any targeted enemy. Press {Real_AcquireTarget} to target an enemy under the reticle.
InspectTargetIDV2 = This upgraded Target ID V2 displays a target's current objective. Holding {Real_AcquireTarget} will scramble their priority computer but uses energy.
InspectTargetIDV3 = This advanced Target ID V3 displays a more detailed vital readout, identifies enemy weak points, and lowers the time to scramble priority systems.
InspectTurboBoots = The Turbo Motion Boots V1 provide a speed boost while holding {Real_Sprint} at the expense of energy.
InspectTurboBootsV2 = These upgraded Turbo Boots V2 provide a jump-assist while holding {Real_Jump} at the expense of energy.
InspectTurboBootsV3 = These advanced Turbo Boots V3 increase the vertical thrust of the jump-system.
InspectEnergyShield = The Energy/Projectile Shield V1 absorbs a minor amount of damage from projectiles and energy beams at the expense of energy.\nTouch its icon on your right forearm with a finger of your left hand to turn it on or off.
InspectEnergyShieldV2 = This upgraded Energy Shield V2 absorbs an increased amount of damage for proportionally more energy.
InspectEnergyShieldV3 = This advanced Energy Shield V3 absorbs the maximum amount of damage for proportionally more energy.
InspectEnviroPack = The Environmental Protection Pack V1 protects the user from biological contamination at the expense of energy.\nTouch its icon on your right forearm with a finger of your left hand to turn it on or off.
InspectEnviroPackV2 = This advanced Enviro Pack V2 protects the user from radiation in addition to biological contamination at the expense of energy.
InspectSensaround = The Sensaround Radar Unit V1 utilizes a radar system to scan around the user to locate useful items at the expense of a small amount of energy.\nTouch its icon on your right forearm with a finger of your left hand to turn it on or off.
InspectSensaroundV2 = This upgraded Sensaround V2 detects enemies located nearby the user for a small amount of energy.
InspectSensaroundV3 = This advanced Sensaround V3 can penetrate through walls and reveal hidden passageways for a small amount of energy.
InspectInventoryExpander = The Micro Pocket Dimension provides additional inventory space.
