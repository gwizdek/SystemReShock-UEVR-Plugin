function categoryClass(name) {
  // strip leading A or U
  const core = name.replace(/^[AU]/, '');
  // multi-segment prefixes
  if (core.startsWith('CIRCUITPUZZLE_')) return 'cat-CIRCUITPUZZLE';
  if (core.startsWith('WIREPUZZLE_')) return 'cat-WIREPUZZLE';
  const prefix = core.split('_')[0];
  return 'cat-' + prefix;
}

function fileLink(file) {
  if (!file) return '';
  const rel = file.replace(/\\\\/g, '/').replace(/^SystemShockVR\//, '../SystemShockVR/');
  const display = file.split(/[\\\\/]/).pop();
  return `<span class="file"><a href="${rel}" title="${rel}">${display}</a></span>`;
}

function countDescendants(node) {
  let n = 0;
  for (const c of node.children || []) {
    n += 1 + countDescendants(c);
  }
  return n;
}

let totalNodes = 0;
function buildNode(node, isRoot=false) {
  totalNodes++;
  const li = document.createElement('li');
  li.className = 'node ' + categoryClass(node.name);
  if (isRoot) li.classList.add('root');

  const hasKids = node.children && node.children.length > 0;
  const desc = hasKids ? countDescendants(node) : 0;

  const row = document.createElement('span');
  row.className = 'row';

  const tog = document.createElement('span');
  tog.className = 'toggle' + (hasKids ? '' : ' leaf');
  if (hasKids) {
    tog.addEventListener('click', () => li.classList.toggle('collapsed'));
  }
  row.appendChild(tog);

  const nm = document.createElement('span');
  nm.className = 'name';
  nm.textContent = node.name;
  nm.title = 'click to copy';
  nm.addEventListener('click', () => {
    navigator.clipboard && navigator.clipboard.writeText(node.name);
    nm.style.outline = '1px solid var(--accent)';
    setTimeout(() => nm.style.outline = '', 400);
  });
  row.appendChild(nm);

  if (hasKids) {
    const cnt = document.createElement('span');
    cnt.className = 'count';
    cnt.textContent = `(${node.children.length} direct, ${desc} total)`;
    row.appendChild(cnt);
  }

  row.appendChild(document.createRange().createContextualFragment(fileLink(node.file)));

  li.appendChild(row);

  if (hasKids) {
    const ul = document.createElement('ul');
    for (const c of node.children) ul.appendChild(buildNode(c));
    li.appendChild(ul);
  }
  return li;
}

const tree = document.getElementById('tree');
tree.appendChild(buildNode(DATA, true));

const stats = document.getElementById('stats');
stats.textContent = `${totalNodes} classes`;

// expand/collapse all
document.getElementById('expandAll').addEventListener('click', () => {
  document.querySelectorAll('li.node.collapsed').forEach(li => li.classList.remove('collapsed'));
});
document.getElementById('collapseAll').addEventListener('click', () => {
  document.querySelectorAll('#tree li.node').forEach(li => {
    if (li.querySelector(':scope > ul')) li.classList.add('collapsed');
  });
  // keep root expanded
  const rootLi = document.querySelector('#tree > li.root');
  if (rootLi) rootLi.classList.remove('collapsed');
});

// search filter — highlight matches and reveal ancestors
const search = document.getElementById('search');
function applyFilter(q) {
  q = q.trim().toLowerCase();
  const allLi = document.querySelectorAll('#tree li.node');
  // clear previous
  allLi.forEach(li => li.classList.remove('match'));
  if (!q) return;
  let hits = 0;
  allLi.forEach(li => {
    const nm = li.querySelector(':scope > .row > .name').textContent.toLowerCase();
    if (nm.includes(q)) {
      li.classList.add('match');
      hits++;
      // reveal ancestors
      let p = li.parentElement;
      while (p && p.id !== 'tree') {
        if (p.tagName === 'LI') p.classList.remove('collapsed');
        p = p.parentElement;
      }
    }
  });
  stats.textContent = `${totalNodes} classes — ${hits} match`;
}
search.addEventListener('input', e => applyFilter(e.target.value));
applyFilter('');
